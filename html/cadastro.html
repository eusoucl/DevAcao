<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se como voluntário da DevAção.">
    <title>Seja Voluntário | DevAção</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>DevAção</h1>
        <p>Transformando conhecimento em oportunidades</p>

        <nav>
            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">☰</label>

            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Iniciativas</a></li>
                <li><a href="cadastro.html" aria-current="page">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>

            <h2>Cadastro de Voluntário</h2>

            <p>Preencha o formulário para fazer parte da rede de colaboradores da DevAção.</p>

            <form id="form-cadastro" novalidate>

                <fieldset>

                    <legend>Dados pessoais</legend>

                    <div>
                        <label for="nome">Nome completo</label><br>
                        <input type="text" id="nome" name="nome" required minlength="5">
                        <small class="erro" aria-live="polite"></small>
                    </div>

                    <div>
                        <label for="email">E-mail</label><br>
                        <input type="email" id="email" name="email" required>
                        <small class="erro" aria-live="polite"></small>
                    </div>

                    <div>
                        <label for="cpf">CPF</label><br>
                        <input type="text" id="cpf" name="cpf" required maxlength="14"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            placeholder="000.000.000-00">
                        <small class="erro" aria-live="polite"></small>
                    </div>

                    <div>
                        <label for="telefone">Telefone</label><br>
                        <input type="tel" id="telefone" name="telefone" required maxlength="15"
                            pattern="\(\d{2}\) \d{4,5}-\d{4}"
                            placeholder="(00) 00000-0000">
                        <small class="erro" aria-live="polite"></small>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Endereço</legend>

                    <div>
                        <label for="cep">CEP</label><br>
                        <input type="text" id="cep" name="cep" required maxlength="9"
                            pattern="\d{5}-\d{3}"
                            placeholder="00000-000">
                        <small class="erro" aria-live="polite"></small>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Sobre você</legend>

                    <div>
                        <label for="area">Área de interesse</label><br>

                        <select id="area" name="area" required>
                            <option value="">Selecione</option>
                            <option value="oficina">Oficina de Lógica</option>
                            <option value="trilha-web">Trilha Web</option>
                            <option value="mentoria">Mentoria</option>
                        </select>

                        <small class="erro" aria-live="polite"></small>
                    </div>

                    <div>
                        <label>
                            <input type="checkbox" id="termos" name="termos" required>
                            Aceito os termos de uso.
                        </label>

                        <small class="erro" aria-live="polite"></small>
                    </div>

                </fieldset>

                <button type="submit">Enviar cadastro</button>

                <p id="mensagem-sucesso" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 DevAção. Todos os direitos reservados.</p>
    </footer>

    <script src="../js/cadastro.js" defer></script>

</body>
</html>
